syntax = "proto3";

package plugin.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/lucasglmt/patchcord/api/plugin/v1;pluginv1";

// PluginService is implemented by every Patchcord plugin process. The agent
// dials it right after launching the plugin and must complete the handshake
// before using any of its contributions.
service PluginService {
  // Handshake negotiates the protocol version and returns the plugin's
  // manifest: its identity, version, and the connectors/actions it
  // contributes to the agent.
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);

  // ExecuteAction runs one of the plugin's contributed actions and returns
  // its output. The agent only calls this for actions listed in the
  // manifest's Contributions returned by Handshake.
  rpc ExecuteAction(ExecuteActionRequest) returns (ExecuteActionResponse);

  // TestConnector attempts to use a connector's resolved configuration and
  // secrets to reach the external system it describes, without running any
  // action. A plugin that does not support connector testing returns
  // UNIMPLEMENTED; the agent surfaces that as "this plugin does not support
  // connection testing", distinct from a test that ran and failed (Ok =
  // false). The agent only calls this for a connector whose type is listed
  // in the manifest's Contributions returned by Handshake.
  rpc TestConnector(TestConnectorRequest) returns (TestConnectorResponse);
}

// HandshakeRequest is sent once, immediately after the agent connects to a
// freshly launched plugin process.
message HandshakeRequest {
  // Highest plugin protocol version the calling agent supports.
  uint32 protocol_version = 1;
}

// HandshakeResponse carries the plugin's manifest, as introduced in the
// vision document (section 8.3).
message HandshakeResponse {
  // Protocol version the plugin will speak for the rest of this session.
  // Must not exceed HandshakeRequest.protocol_version; the agent rejects the
  // plugin if it does.
  uint32 protocol_version = 1;

  string plugin_id = 2;
  string plugin_version = 3;

  Contributions contributes = 4;
  repeated string permissions = 5;
}

// Contributions lists what a plugin adds to the agent's registries once
// installed, as full descriptors rather than bare identifiers (ADR-0062) —
// each carries a human-readable description and a JSON Schema for its
// shape, so both a human and a coding agent can discover how to use it
// without reading the plugin's source.
//
// Field numbers 1 and 2 carried plain identifier lists in protocol version
// 1 ("io.patchcord.example-text" et al. spoke it) and are reserved rather
// than reused for the differently-typed fields below: changing a field's
// wire type in place, instead of retiring its number, would make a v1
// plugin's response silently decode as an empty v2 Contributions rather
// than fail the handshake with a clear error. The names "connectors" and
// "actions" are reused on the new field numbers deliberately — only the
// numbers need to stay unique. See HandshakeResponse.protocol_version and
// ADR-0062.
message Contributions {
  reserved 1, 2;

  repeated ConnectorDescriptor connectors = 3;
  repeated ActionDescriptor actions = 4;
}

// ActionDescriptor fully describes one action a plugin contributes, as
// specified by the vision document (section 7.4: identifier, inputs,
// outputs, default timeout) and closed by ADR-0062.
message ActionDescriptor {
  // The action's stable, versioned identifier, e.g. "text.uppercase@1".
  string id = 1;
  // One human-readable sentence: what this action does.
  string description = 2;
  // JSON Schema describing the shape ExecuteActionRequest.input must
  // match.
  google.protobuf.Struct input_schema = 3;
  // JSON Schema describing the shape ExecuteActionResponse.output will
  // match.
  google.protobuf.Struct output_schema = 4;
  // Default timeout for a call to this action, in seconds. Zero means the
  // agent's own default applies — an action does not have to declare one.
  uint32 default_timeout_seconds = 5;
}

// ConnectorDescriptor fully describes one connector type a plugin
// contributes, as specified by the vision document (section 7.3:
// compatibility with certain actions, which requires being able to
// describe a connector's configuration shape) and closed by ADR-0062.
message ConnectorDescriptor {
  // The connector type's stable, versioned identifier, e.g.
  // "postgresql.connection@1".
  string type = 1;
  // One human-readable sentence: what system this connector reaches.
  string description = 2;
  // JSON Schema describing the shape of this connector's non-secret
  // configuration (ConnectorConfig.config). Never covers secret values —
  // those never appear in a schema meant to be shown or stored (ADR-0009).
  google.protobuf.Struct config_schema = 3;
}

// ExecuteActionRequest asks the plugin to run one action.
message ExecuteActionRequest {
  // The action identifier, e.g. "text.uppercase@1".
  string action = 1;
  google.protobuf.Struct input = 2;
  // The resolved configuration and secrets of the connector the calling
  // workflow step bound to this action, if any. Absent when the step bound
  // no connector. Never persisted by the agent — assembled fresh for this
  // one call.
  ConnectorConfig connector = 3;
}

// ConnectorConfig carries one connector's resolved configuration and secret
// values, ready for a plugin to use for the duration of one action call.
message ConnectorConfig {
  string type = 1;
  google.protobuf.Struct config = 2;
  google.protobuf.Struct secrets = 3;
}

// ExecuteActionResponse carries the action's output.
message ExecuteActionResponse {
  google.protobuf.Struct output = 1;
}

// TestConnectorRequest asks the plugin to attempt a connection using one
// connector's resolved configuration and secrets.
message TestConnectorRequest {
  ConnectorConfig connector = 1;
}

// TestConnectorResponse reports the outcome of a connector test. A failed
// attempt (Ok = false) is a legitimate result, not an RPC error — the same
// distinction ExecuteActionResponse's callers already make between a
// business-level failure and a transport-level one.
message TestConnectorResponse {
  bool ok = 1;
  // Human-readable detail: the error message on failure, or empty/a short
  // confirmation on success.
  string message = 2;
}
