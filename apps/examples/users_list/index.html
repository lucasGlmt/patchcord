<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patchcord Greeter (demo)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Get users</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
  </nav>
  <div class="container mt-4">
    <button class="btn btn-primary" id="getUsersBtn">Get users</button>

    <h3>Results</h3>
    <pre id="result">
      no results
    </pre>
  </div>
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

    <script>
        function getUserlist() {
          return new Promise(async (resolve, reject) => {
            const sessionResponse = await fetch("/v1/apps/userlist/sessions", { method: "POST" });

            if (!sessionResponse.ok) {
              reject(`could not get a session (${sessionResponse.status})`);
              return;
            }

            const session = await sessionResponse.json();

            const runResponse = await fetch("/v1/workflows/http_api_task/run", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${session.token}`,
            },
            body: JSON.stringify({
              bindings: {
                api: "todolist"
              }
            }),
          });
          if (!runResponse.ok) {
            reject(`run failed (${runResponse.status})`);
            return;
          }
          let run = await runResponse.json();

          while (run.status === "queued" || run.status === "running") {
            await new Promise((resolve) => setTimeout(resolve, 150));
            const pollResponse = await fetch(`/v1/runs/${run.id}`);
            run = await pollResponse.json();
          }

          if (run.status !== "succeeded") {
            reject(run.error || `run ended as ${run.status}`);
            return;
          }

          resolve(run.outputs.value);
          })
        }

        $("#getUsersBtn").click(async () => {
          $("#getUsersBtn").prop('disabled', true);
          getUserlist()
            .then(data => {
              $("#result").text(data)
            })
            .catch(err => $("#result").text(err))
            .finally(() => {
              $("#getUsersBtn").prop('disabled', false);
            });
        });
    </script>
  </body>
</html>
