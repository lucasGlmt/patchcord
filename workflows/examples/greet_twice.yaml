schema_version: 1

id: greet_twice
version: 3

trigger:
  type: manual

steps:
  - id: shout
    uses: text.uppercase@1
    with:
      value: "${{ workflow.inputs.name }}"

  - id: shout_again
    uses: text.uppercase@1
    with:
      value: "${{ steps.shout.outputs.value }}"

  - id: say_hello
    uses: text.join@1
    with:
      values:
        - "Salut, "
        - "${{ steps.shout.outputs.value }}"