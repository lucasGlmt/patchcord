schema_version: 1

id: greet_twice
version: 4

trigger:
  type: manual

inputs:
  - name: name
    type: string
    required: true
    description: Name to greet.

steps:
  - id: shout
    uses: text.uppercase@1
    with:
      value: "${{ workflow.inputs.name }}"

  - id: shout_again
    uses: text.uppercase@1
    with:
      value: "${{ steps.shout.outputs.value }}"

  - id: say_hello
    uses: text.join@1
    with:
      values:
        - "Salut, "
        - "${{ steps.shout.outputs.value }}"