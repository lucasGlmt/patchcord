# Reference example for the postgresql connector-consuming plugin
# (plugins/examples/postgresql): a step bound to a "postgresql.connection@1"
# connector runs a trivial query through it.
#
# Unlike http_httpbin_demo.yaml or ai_generate_text_demo.yaml, this one
# needs a real PostgreSQL server you control — there is no public demo
# database. "SELECT 1 AS ok" needs no schema, so it works against any
# reachable server/database/user combination.
#
# Run it with:
#   patchcord plugin install ./bin/plugins/postgresql
#   patchcord connector create pg --type "postgresql.connection@1" \
#       --config host=localhost --config port=5432 \
#       --config database=app --config user=admin \
#       --secret password=env:PG_PASSWORD
#   patchcord workflow install workflows/examples/postgresql_query_demo.yaml
#   patchcord workflow run postgresql_query_demo --binding db=pg
schema_version: 1

id: postgresql_query_demo
version: 1

trigger:
  type: manual

steps:
  - id: ping
    uses: postgresql.query@1
    connector: "${{ bindings.db }}"
    with:
      sql: "SELECT 1 AS ok"
